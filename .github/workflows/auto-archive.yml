name: Auto Archive Root Garbage

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  auto-archive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Move unexpected root items to archive
        run: |
          echo "Scanning root for unexpected items..."

          allowed=(
            "README.md"
            "CONTRIBUTING.md"
            "LICENSE"
            ".gitignore"
            "docs"
            "spec"
            "scripts"
            "examples"
            "archive"
            ".github"
          )

          today=$(date +%Y-%m-%d)
          target="archive/$today/auto-archive"
          mkdir -p "$target"

          moved=0
          shopt -s dotglob nullglob
          for item in * .*; do
            [[ "$item" == "." || "$item" == ".." || "$item" == ".git" ]] && continue

            keep=false
            for a in "${allowed[@]}"; do
              [[ "$item" == "$a" ]] && keep=true
            done

            if [ "$keep" = false ]; then
              echo "Moving $item -> $target/$item"
              mv "$item" "$target/$item"
              moved=1
            fi
          done

          if [ $moved -eq 1 ]; then
            echo "Archived unexpected root items."
          else
            echo "No unexpected root items found."
          fi
